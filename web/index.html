<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Farm to Stars (Web)</title>
  <style>
    html, body, #app { height: 100%; margin: 0; background: #0e0e10; color: #e5e7eb; }
    .hud {
      position: fixed; left: 12px; top: 12px; padding: 8px 10px;
      border-radius: 10px; border: 1px solid #ffffff22;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #111a; backdrop-filter: blur(6px);
    }
    .hud span { display:inline-block; min-width: 90px; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <span>Wood: <b id="wood">0</b></span>
    <span>Stone: <b id="stone">0</b></span>
    <button id="installAudio">Enable Audio</button>
    <button id="mute" aria-pressed="false">Mute</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
