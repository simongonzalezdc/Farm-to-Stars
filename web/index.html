<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Farm to Stars (Web)</title>
  <style>
    html, body, #app { height: 100%; margin: 0; background: #0e0e10; color: #e5e7eb; }
    .hud {
      position: fixed; left: 12px; top: 12px; padding: 12px 16px;
      border-radius: 10px; border: 1px solid #ffffff22;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #111a; backdrop-filter: blur(6px);
      max-width: 360px;
      line-height: 1.4;
    }
    .hud h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #cbd5f5; }
    .hud .row { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 8px; align-items: center; }
    .hud .row:last-child { margin-bottom: 0; }
    .hud span { display: inline-flex; gap: 4px; align-items: baseline; }
    .hud b { color: #f8fafc; font-weight: 600; }
    .hud button { font-family: inherit; border-radius: 6px; border: 1px solid #ffffff33; background: #1f293780; color: #f3f4f6; padding: 4px 8px; cursor: pointer; }
    .hud button:hover { background: #334155a6; }
    .hud button[aria-pressed='true'] { background: #2563ebb5; border-color: #3b82f6; }
    .hud .feedback { font-size: 13px; color: #f9fafb; background: #1d3b5ab8; padding: 6px 8px; border-radius: 6px; }
    .hud .labels { font-size: 12px; opacity: 0.8; }
    .hud .queue { font-size: 13px; }
    .hud small { opacity: 0.75; }
    .hud .season-row { flex-direction: column; align-items: flex-start; gap: 4px; }
    .hud .season-name { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .hud .season-effects { font-size: 12px; opacity: 0.85; }
    .hud .season-timer { font-size: 11px; opacity: 0.75; letter-spacing: 0.02em; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <h2>Colony HUD</h2>
    <div class="row">
      <span>Wood: <b id="wood">0</b></span>
      <span>Stone: <b id="stone">0</b></span>
      <span>Mode: <b id="modeIndicator">Camera</b></span>
      <span>Cost: <b id="selectedCost">—</b></span>
    </div>
    <div class="row season-row">
      <span id="seasonName" class="season-name">🌱 Spring Awakening</span>
      <small id="seasonEffects" class="season-effects">+20% growth speed, +10% resource yield.</small>
      <small id="seasonTimer" class="season-timer">Year 1 • Cycle 1 • Next in 03:00</small>
    </div>
    <div class="row">
      <button id="installAudio">Enable Audio</button>
      <button id="mute" aria-pressed="false">Mute</button>
    </div>
    <div class="row labels">
      <span>Build options:</span>
    </div>
    <div class="row">
      <button data-building="cottage" aria-pressed="false">Cottage</button>
    </div>
    <div class="row queue">
      <span>Queue: <b id="buildQueue">0</b></span>
      <small id="queueDetails">No active construction.</small>
    </div>
    <div class="row">
      <div id="buildFeedback" class="feedback">Camera pan + zoom enabled.</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
